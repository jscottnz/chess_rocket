<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Rocket Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #e94560;
    --green: #4caf50;
    --light-green: #8bc34a;
    --blue: #2196f3;
    --yellow: #ffc107;
    --orange: #ff9800;
    --red: #f44336;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
  }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .header-stats { display: flex; gap: 16px; font-size: 0.9rem; color: var(--text-dim); }
  .main {
    display: grid;
    grid-template-columns: minmax(320px, 520px) minmax(360px, 1fr);
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    height: auto;
    min-height: 100vh;
    margin: 0 auto;
    overflow: visible;
  }
  .left-column, .right-column { min-width: 0; min-height: 0; }
  .left-column { display: flex; flex-direction: column; gap: 10px; overflow: visible; }
  .board-col { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
  .board-wrapper { width: min(100%, calc(100vh - 355px)); aspect-ratio: 1; position: relative; margin: 0 auto; }
  #board { width: 100% !important; height: auto !important; touch-action: none; }
  html.board-dragging, html.board-dragging body {
    overflow: hidden;
    overscroll-behavior: none;
  }
  /* Chessboard.js coordinates: make the file/rank labels readable on both square colors. */
  #board [class*="notation-"] {
    z-index: 2;
    font-size: clamp(11px, 1.8vw, 16px) !important;
    font-weight: 800 !important;
    line-height: 1 !important;
    padding: 2px 4px;
    border-radius: 3px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
  }
  #board [class*="white-"] [class*="notation-"] {
    color: #25170c !important;
    background: rgba(255, 255, 255, .68);
    text-shadow: 0 1px 1px rgba(255, 255, 255, .8);
  }
  #board [class*="black-"] [class*="notation-"] {
    color: #fff !important;
    background: rgba(0, 0, 0, .42);
  }
  .board-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .overlay-square { fill: rgba(255, 193, 7, .28); stroke: rgba(255, 193, 7, .85); stroke-width: .06; }
  .overlay-arrow { stroke: #e94560; stroke-width: .12; stroke-linecap: round; opacity: .92; }
  .overlay-label { fill: white; font-size: .34px; font-weight: 700; paint-order: stroke; stroke: #16213e; stroke-width: .04px; }
  .last-move-arrow { stroke: #4caf50; stroke-width: .09; stroke-linecap: round; opacity: .75; }
  .message-square { fill: rgba(33, 150, 243, .14); stroke: rgba(33, 150, 243, .48); stroke-width: .045; }
  .message-piece { fill: none; stroke: rgba(33, 150, 243, .58); stroke-width: .07; }
  .message-selected-square { fill: rgba(255, 193, 7, .28); stroke: rgba(255, 193, 7, .95); stroke-width: .08; }
  .message-selected-piece { fill: none; stroke: rgba(255, 193, 7, .95); stroke-width: .09; }
  .tap-selected-square { fill: rgba(233, 69, 96, .24); stroke: rgba(233, 69, 96, .98); stroke-width: .09; }
  .tap-selected-piece { fill: none; stroke: #fff; stroke-width: .1; }
  .message-move-arrow { fill: none; stroke-width: .09; stroke-linecap: round; opacity: .58; transition: opacity .12s, stroke-width .12s; }
  .message-move-arrow.white { stroke: #81c784; }
  .message-move-arrow.black { stroke: #ffab91; }
  .message-move-arrow.emphasised { stroke-width: .16; opacity: 1; }
  .message-move-square { stroke-width: .055; opacity: .48; }
  .message-move-square.white { fill: rgba(129, 199, 132, .17); stroke: #81c784; }
  .message-move-square.black { fill: rgba(255, 171, 145, .17); stroke: #ffab91; }
  .message-move-square.emphasised { opacity: .9; stroke-width: .09; }
  .board-info {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--text-dim);
  }
  .board-actions { display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .undo-button { padding: 5px 10px; font-size: .78rem; background: var(--surface2); }
  .copy-button { padding: 5px 10px; font-size: .78rem; background: var(--blue); }
  .end-game-button { padding: 5px 10px; font-size: .78rem; background: var(--accent); }
  .reset-puzzle-button { display: none; padding: 5px 10px; font-size: .78rem; background: var(--blue); }
  .reset-puzzle-button.visible { display: inline-block; }
  .capture-alert { display: none; margin-top: 4px; padding: 5px 8px; border-left: 3px solid var(--orange); border-radius: 4px; background: rgba(255, 152, 0, .13); color: #ffcc80; font-size: .82rem; font-weight: 700; }
  .capture-alert.visible { display: block; }
  .stats-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; overflow-y: auto; padding-right: 3px; }
  .stats-panels .panel { min-width: 0; padding: 9px 10px; }
  .stats-panels .panel h2 { margin-bottom: 5px; }
  .stats-panels .game-over-banner { grid-column: 1 / -1; }
  .stats-panels .panel:nth-child(1), .stats-panels .panel:nth-child(3), .stats-panels .panel:nth-child(5) { grid-column: 1 / -1; }
  .panel {
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 16px;
    border-left: 3px solid var(--surface2);
  }
  .panel h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  /* Opening panel */
  .opening-name { font-size: 1.1rem; font-weight: 600; }
  .opening-eco { color: var(--accent); font-weight: 500; margin-left: 8px; }
  .out-of-book { color: var(--text-dim); font-style: italic; }
  /* Material panel */
  .material-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .material-label { font-size: 0.85rem; }
  .material-value { font-weight: 600; font-size: 1.1rem; }
  .material-diff { font-size: 0.9rem; font-weight: 600; }
  .material-diff.positive { color: var(--green); }
  .material-diff.negative { color: var(--red); }
  .material-diff.even { color: var(--text-dim); }
  .captured { font-size: 1.2rem; letter-spacing: 2px; min-height: 1.5em; }
  /* Eval bar */
  .eval-container { display: flex; align-items: center; gap: 12px; }
  .eval-bar-outer {
    flex: 1; height: 20px; background: #333;
    border-radius: 10px; overflow: hidden; position: relative;
  }
  .eval-bar-inner {
    height: 100%; background: linear-gradient(90deg, #fff 0%, #ccc 100%);
    transition: width 0.4s ease; border-radius: 10px;
  }
  .eval-score { font-weight: 700; font-size: 1rem; min-width: 60px; text-align: right; }
  /* Status panel */
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 0.9rem; }
  .status-label { color: var(--text-dim); }
  .status-value { font-weight: 500; }
  .check-indicator { color: var(--yellow); font-weight: 600; }
  .checkmate-indicator { color: var(--red); font-weight: 700; }
  /* Move history */
  .move-history {
    max-height: 200px; overflow-y: auto;
    font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.85rem;
  }
  .move-row { display: flex; align-items: baseline; padding: 2px 0; }
  .move-num { color: var(--text-dim); min-width: 32px; text-align: right; margin-right: 8px; }
  .move-cell { min-width: 80px; display: inline-flex; align-items: baseline; gap: 4px; }
  .move-san { cursor: default; }
  .move-review { padding: 2px 5px; font-size: .65rem; background: var(--surface2); }
  .badge { font-size: 0.7rem; font-weight: 700; border-radius: 3px; padding: 0 3px; }
  .badge-best { color: var(--green); }
  .badge-great { color: var(--light-green); }
  .badge-good { color: var(--blue); }
  .badge-inaccuracy { color: var(--yellow); }
  .badge-mistake { color: var(--orange); }
  .badge-blunder { color: var(--red); }
  /* Game over banner */
  .game-over-banner {
    background: var(--surface2);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    display: none;
  }
  .game-over-banner.visible { display: block; }
  .game-over-result { font-size: 1.3rem; font-weight: 700; }
  .game-over-details { font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }
  /* Waiting state */
  .waiting {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim); font-size: 1.1rem;
  }
  .waiting .pulse { animation: pulse 2s infinite; }
  .setup { margin: 24px auto; max-width: 420px; background: var(--surface); padding: 22px; border-radius: 10px; text-align: left; }
  .setup h2 { margin-bottom: 14px; font-size: 1.05rem; }
  .setup-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .setup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .setup label { flex: 1; color: var(--text-dim); font-size: .82rem; }
  .setup select, .setup input, .chat-input { width: 100%; margin-top: 5px; padding: 9px; border: 1px solid var(--surface2); border-radius: 5px; background: var(--bg); color: var(--text); }
  button { cursor: pointer; border: 0; border-radius: 5px; padding: 9px 14px; background: var(--accent); color: white; font-weight: 600; }
  button:disabled { opacity: .55; cursor: wait; }
  .right-column { height: max(calc(100vh - 94px), 520px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "chat notes"; gap: 10px; min-height: 0; }
  .chat-panel { grid-area: chat; display: flex; flex-direction: column; height: 100%; min-width: 0; min-height: 0; overflow: hidden; }
  .notes-panel { grid-area: notes; display: flex; flex-direction: column; min-height: 0; }
  .notes-help { color: var(--text-dim); font-size: .78rem; line-height: 1.35; margin-bottom: 8px; }
  .notes-input { flex: 1; min-height: 180px; width: 100%; resize: vertical; padding: 9px; border: 1px solid var(--surface2); border-radius: 5px; background: var(--bg); color: var(--text); font: inherit; line-height: 1.4; }
  .notes-footer { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .notes-status { color: var(--text-dim); font-size: .75rem; }
  #notes-add-explanation { display: none; }
  .chat-messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .chat-message { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; font-size: .88rem; line-height: 1.4; }
  .chat-message.user { background: var(--surface2); align-self: flex-end; max-width: 88%; }
  .chat-message.assistant { background: #202b4a; align-self: flex-start; max-width: 94%; }
  .chat-token-square { color: #64b5f6; background: rgba(33, 150, 243, .14); border-radius: 3px; padding: 0 3px; font-weight: 700; }
  .chat-token-piece { border-radius: 3px; padding: 0 3px; font-weight: 700; }
  .chat-token-annotation { cursor: pointer; transition: box-shadow .12s, outline .12s; }
  .chat-token-annotation:hover, .chat-token-annotation.selected { outline: 1px solid rgba(255, 193, 7, .85); box-shadow: 0 0 0 2px rgba(255, 193, 7, .14); }
  .chat-token-jargon { color: #80cbc4; background: rgba(0, 150, 136, .16); border-bottom: 1px dotted #80cbc4; }
  .chat-token-move { border-radius: 3px; padding: 0 3px; font-weight: 700; }
  .chat-token-move.white { color: #b9f6ca; background: rgba(129, 199, 132, .15); }
  .chat-token-move.black { color: #ffccbc; background: rgba(255, 171, 145, .15); }
  .chat-token-piece.king { color: #ffd54f; background: rgba(255, 193, 7, .14); }
  .chat-token-piece.queen { color: #f48fb1; background: rgba(233, 69, 96, .14); }
  .chat-token-piece.rook { color: #81d4fa; background: rgba(33, 150, 243, .14); }
  .chat-token-piece.bishop { color: #ce93d8; background: rgba(156, 39, 176, .14); }
  .chat-token-piece.knight { color: #ffb74d; background: rgba(255, 152, 0, .14); }
  .chat-token-piece.pawn { color: #a5d6a7; background: rgba(76, 175, 80, .14); }
  .chat-form { display: flex; gap: 8px; align-items: flex-end; }
  .chat-form .chat-input { flex: 1; resize: vertical; min-height: 38px; }
  .chat-options { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: var(--text-dim); font-size: .78rem; }
  .chat-options input { accent-color: var(--accent); }
  .better-moves-button { padding: 5px 8px; font-size: .75rem; background: var(--blue); }
  .move-pending { opacity: .6; pointer-events: none; }
  .lesson-controls { display: none; align-items: center; gap: 8px; margin-top: 10px; font-size: .8rem; color: var(--text-dim); }
  .lesson-controls.visible { display: flex; }
  .lesson-controls button { padding: 5px 9px; font-size: .75rem; }
  #lesson-title { flex: 1; }
  @media (max-width: 760px) {
    .main { display: flex; flex-direction: column; gap: 10px; height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
    /* Flatten the desktop columns so the playing flow remains visible without
       scrolling past the coaching conversation and controls. */
    .left-column, .right-column, .board-col { display: contents; }
    .board-wrapper { order: 1; }
    .chat-panel { order: 2; height: min(46vh, 420px); min-height: 300px; }
    .board-info { order: 3; }
    .capture-alert { order: 4; }
    .stats-panels { order: 5; }
    .notes-panel { order: 6; }
    .board-wrapper { width: min(100%, 72vh); }
    .board-info { flex-wrap: wrap; gap: 6px; }
    .board-actions { margin-left: 0; flex-wrap: wrap; }
    .stats-panels { overflow: visible; }
    .notes-input { min-height: 150px; }
  }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
</style>
</head>
<body>

<div class="main" id="main-content">
  <div class="waiting" id="waiting">
    <p class="pulse">Chess Rocket Tutor</p>
    <div class="setup">
      <h2>Start a coached game</h2>
      <div class="setup-row">
        <label>Play as
          <select id="setup-color"><option value="white">White</option><option value="black">Black</option></select>
        </label>
        <label>Coach strength
          <input id="setup-elo" type="number" min="100" max="3500" step="50" value="800">
        </label>
      </div>
      <div class="setup-row">
        <label>Puzzle level
          <select id="puzzle-difficulty"><option value="all">Any level</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select>
        </label>
        <label>Puzzle theme
          <select id="puzzle-motif"><option value="all">Any theme</option><option value="fork">Fork</option><option value="pin">Pin</option><option value="skewer">Skewer</option><option value="checkmate">Checkmate</option><option value="back_rank_mate">Back rank</option><option value="endgame">Endgame</option></select>
        </label>
      </div>
      <div class="setup-actions">
        <button id="start-game" type="button">Start game</button>
        <button id="start-puzzle" type="button" style="background: var(--blue);">Play puzzle</button>
      </div>
    </div>
  </div>
</div>

<!-- Game layout (hidden until game data arrives) -->
<template id="game-template">
  <div class="left-column">
    <div class="board-col">
      <div class="board-wrapper">
        <div id="board"></div>
        <svg id="board-overlay" class="board-overlay" viewBox="0 0 8 8" aria-hidden="true">
          <defs>
            <marker id="arrow-head" markerWidth="4" markerHeight="4" refX="3.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#e94560"></path></marker>
            <marker id="last-arrow-head" markerWidth="4" markerHeight="4" refX="3.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#4caf50"></path></marker>
            <marker id="message-white-arrow-head" markerWidth="4" markerHeight="4" refX="3.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#81c784"></path></marker>
            <marker id="message-black-arrow-head" markerWidth="4" markerHeight="4" refX="3.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#ffab91"></path></marker>
          </defs>
          <g id="last-move-drawing"></g>
          <g id="tap-selection"></g>
          <g id="message-highlights"></g>
          <g id="message-move-highlights"></g>
          <g id="overlay-drawing"></g>
        </svg>
      </div>
      <div class="board-info">
        <span id="player-info">Playing as: White</span>
        <span id="engine-info">Engine: 800 Elo</span>
        <span class="board-actions">
          <button type="button" class="reset-puzzle-button" id="reset-puzzle">Reset</button>
          <button type="button" class="undo-button" id="undo-move" disabled>Undo</button>
          <button type="button" class="copy-button" id="copy-pgn" title="Copy the game as PGN">Copy PGN</button>
          <button type="button" class="copy-button" id="copy-fen" title="Copy the current board position as FEN">Copy FEN</button>
          <button type="button" class="end-game-button" id="end-game">End game</button>
        </span>
      </div>
      <div class="capture-alert" id="capture-alert" aria-live="polite"></div>
    </div>
    <div class="stats-panels">
    <div class="panel" style="border-left-color: var(--accent);">
      <h2>Opening</h2>
      <div id="opening-display"><span class="out-of-book">Starting position</span></div>
    </div>
    <div class="panel" style="border-left-color: var(--blue);">
      <h2>Material Balance</h2>
      <div class="material-row">
        <span class="material-label">White</span>
        <span class="material-value" id="mat-white">39</span>
      </div>
      <div class="material-row">
        <span class="material-label">Black</span>
        <span class="material-value" id="mat-black">39</span>
      </div>
      <div class="material-row">
        <span class="material-label">Advantage</span>
        <span class="material-diff even" id="mat-diff">Even</span>
      </div>
      <div style="margin-top:6px;">
        <div class="captured" id="captured-white" title="Pieces captured by White"></div>
        <div class="captured" id="captured-black" title="Pieces captured by Black"></div>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--green);">
      <h2>Evaluation</h2>
      <div class="eval-container">
        <div class="eval-bar-outer">
          <div class="eval-bar-inner" id="eval-bar" style="width:50%"></div>
        </div>
        <span class="eval-score" id="eval-score">0.0</span>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--yellow);">
      <h2>Game Status</h2>
      <div class="status-grid">
        <span class="status-label">Move</span>
        <span class="status-value" id="move-number">1</span>
        <span class="status-label">Turn</span>
        <span class="status-value" id="turn-display">White</span>
        <span class="status-label">Accuracy (W)</span>
        <span class="status-value" id="acc-white">--</span>
        <span class="status-label">Accuracy (B)</span>
        <span class="status-value" id="acc-black">--</span>
        <span class="status-label">Status</span>
        <span class="status-value" id="check-status">--</span>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--orange);">
      <h2>Move History</h2>
      <div class="move-history" id="move-history"></div>
    </div>
    <div class="game-over-banner" id="game-over">
      <div class="game-over-result" id="game-over-result"></div>
      <div class="game-over-details" id="game-over-details"></div>
    </div>
    </div>
  </div>
  <div class="right-column">
    <div class="panel notes-panel" style="border-left-color: var(--blue);">
      <h2>Notes</h2>
      <p class="notes-help">Your persistent tutor notes. Add goals, recurring mistakes, and things to remember.</p>
      <textarea class="notes-input" id="notes-input" placeholder="e.g. I often move too quickly in the opening..."></textarea>
      <div class="notes-footer">
        <button type="button" id="notes-save">Save notes</button>
        <button type="button" id="notes-add-explanation">Add explanation</button>
        <span class="notes-status" id="notes-status">Saved across games</span>
      </div>
    </div>
    <div class="panel chat-panel" style="border-left-color: var(--accent);">
      <h2>Coach</h2>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-options">
        <label><input type="checkbox" id="show-next-hint"> Show next-move hints automatically</label>
        <label><input type="checkbox" id="explain-engine-move"> Explain why the coach moved</label>
        <button type="button" class="better-moves-button" id="better-moves">Better moves</button>
      </div>
      <form class="chat-form" id="chat-form">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="Ask about the position..."></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
      <div class="lesson-controls" id="lesson-controls">
        <button type="button" id="lesson-prev">←</button>
        <button type="button" id="lesson-play">Play</button>
        <button type="button" id="lesson-next">→</button>
        <span id="lesson-title"></span>
        <span id="lesson-count"></span>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script>
(function() {
  'use strict';

  const PIECE_UNICODE = {
    P: '\u2659', N: '\u2658', B: '\u2657', R: '\u2656', Q: '\u2655',
    p: '\u265f', n: '\u265e', b: '\u265d', r: '\u265c', q: '\u265b'
  };

  const BADGE_MAP = {
    best:       { text: '\u2713', cls: 'badge-best' },
    great:      { text: '\u2713', cls: 'badge-great' },
    good:       { text: '\u2022', cls: 'badge-good' },
    inaccuracy: { text: '?!', cls: 'badge-inaccuracy' },
    mistake:    { text: '?',  cls: 'badge-mistake' },
    blunder:    { text: '??', cls: 'badge-blunder' },
  };

  let board = null;
  let lastFen = null;
  let gameActive = false;
  let movePending = false;
  let puzzleMode = false;
  let currentLesson = null;
  let lessonIndex = 0;
  let lessonTimer = null;
  let selectedAnnotationSquare = null;
  let jargonExplanation = null;
  let hoveredMoveAnnotation = null;
  let currentState = null;
  let selectedTapSquare = null;
  let suppressBoardClickUntil = 0;
  let touchTapStart = null;
  let deferBoardStateUntil = 0;

  function initBoard(orientation) {
    const main = document.getElementById('main-content');
    const tmpl = document.getElementById('game-template');
    main.innerHTML = '';
    main.appendChild(tmpl.content.cloneNode(true));
    board = Chessboard('board', {
      position: 'start',
      orientation: orientation || 'white',
      draggable: true,
      onDragStart: startPieceDrag,
      onDrop: finishPieceDrag,
      onSnapEnd: () => setBoardDragScrolling(false),
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    });
    window.addEventListener('resize', () => board.resize());
    window.addEventListener('blur', () => setBoardDragScrolling(false));
    const boardElement = document.getElementById('board');
    boardElement.addEventListener('click', handleBoardTap);
    // Chessboard.js turns every touch into a drag. Capture touch gestures before
    // they reach it so taps consistently use the select-then-destination flow.
    boardElement.addEventListener('touchstart', beginTouchTap, {capture: true, passive: false});
    boardElement.addEventListener('touchmove', trackTouchTap, {capture: true, passive: false});
    boardElement.addEventListener('touchend', finishTouchTap, {capture: true, passive: false});
    boardElement.addEventListener('touchcancel', cancelTouchTap, {capture: true, passive: false});
    gameActive = true;
    loadNotes();
    document.getElementById('notes-save').addEventListener('click', saveNotes);
    document.getElementById('undo-move').addEventListener('click', undoMove);
    document.getElementById('copy-pgn').addEventListener('click', copyPgn);
    document.getElementById('copy-fen').addEventListener('click', copyFEN);
    document.getElementById('reset-puzzle').addEventListener('click', resetPuzzle);
    document.getElementById('end-game').addEventListener('click', endGame);
    document.getElementById('notes-add-explanation').addEventListener('click', addJargonExplanationToNotes);
    document.getElementById('notes-input').addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        saveNotes();
      }
    });
    document.getElementById('chat-form').addEventListener('submit', sendChat);
    document.getElementById('better-moves').addEventListener('click', () => requestBetterMoves());
    document.getElementById('move-history').addEventListener('click', event => {
      const review = event.target.closest('[data-review-ply]');
      if (review) requestBetterMoves(Number(review.dataset.reviewPly), review);
    });
    document.getElementById('chat-messages').addEventListener('click', event => {
      const jargonTarget = event.target.closest('[data-jargon-term]');
      if (jargonTarget) {
        explainJargon(jargonTarget.dataset.jargonTerm);
        return;
      }
      const target = event.target.closest('[data-annotation-square]');
      if (!target) return;
      const square = target.dataset.annotationSquare;
      if (!square) return;
      selectedAnnotationSquare = square;
      document.querySelectorAll('.chat-token-annotation.selected').forEach(el => el.classList.remove('selected'));
      target.classList.add('selected');
      drawMessageHighlights(null, window.lastMessageAnnotations || []);
      const boardElement = document.getElementById('board');
      if (boardElement && window.innerWidth < 760) boardElement.scrollIntoView({behavior: 'smooth', block: 'center'});
    });
    document.getElementById('chat-messages').addEventListener('mouseover', event => {
      const target = event.target.closest('[data-move-uci]');
      if (!target) return;
      hoveredMoveAnnotation = moveAnnotationFromElement(target);
      drawMessageMoveHighlights(window.lastMessageMoveAnnotations || [], hoveredMoveAnnotation);
    });
    document.getElementById('chat-messages').addEventListener('mouseout', event => {
      const target = event.target.closest('[data-move-uci]');
      if (!target || target.contains(event.relatedTarget)) return;
      hoveredMoveAnnotation = null;
      drawMessageMoveHighlights(window.lastMessageMoveAnnotations || []);
    });
    document.getElementById('chat-messages').addEventListener('keydown', event => {
      const jargonTarget = event.target.closest('[data-jargon-term]');
      if (jargonTarget && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        jargonTarget.click();
        return;
      }
      const target = event.target.closest('[data-annotation-square]');
      if (!target || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      target.click();
    });
    document.getElementById('chat-input').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('chat-form').requestSubmit();
      }
    });
    document.getElementById('lesson-prev').addEventListener('click', () => showLessonMove(lessonIndex - 1));
    document.getElementById('lesson-next').addEventListener('click', () => showLessonMove(lessonIndex + 1));
    document.getElementById('lesson-play').addEventListener('click', playLesson);
  }

  async function api(path, body) {
    const response = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: body === undefined ? {} : {'Content-Type': 'application/json'},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const raw = await response.text();
    let result;
    try {
      result = raw ? JSON.parse(raw) : {};
    } catch (error) {
      throw new Error(`Dashboard returned HTTP ${response.status} for ${path}. Restart the dashboard server if this route was added recently.`);
    }
    if (!response.ok || result.error) throw new Error(result.error || 'Request failed');
    return result;
  }

  async function loadNotes() {
    try {
      const result = await api('/api/notes');
      document.getElementById('notes-input').value = result.notes || '';
    } catch (error) {
      document.getElementById('notes-status').textContent = 'Unable to load notes';
    }
  }

  async function saveNotes() {
    const input = document.getElementById('notes-input');
    const button = document.getElementById('notes-save');
    const status = document.getElementById('notes-status');
    button.disabled = true;
    status.textContent = 'Saving...';
    try {
      const result = await api('/api/notes', {notes: input.value});
      input.value = result.notes || '';
      status.textContent = 'Saved across games';
      return true;
    } catch (error) {
      status.textContent = 'Could not save notes';
      return false;
    } finally {
      button.disabled = false;
    }
  }

  function removeLastMoveConversation() {
    const messages = document.getElementById('chat-messages');
    if (!messages) return;
    const children = Array.from(messages.children);
    let moveMessageIndex = -1;
    for (let i = children.length - 1; i >= 0; i--) {
      if (children[i].classList.contains('user') && children[i].textContent.startsWith('I played ')) {
        moveMessageIndex = i;
        break;
      }
    }
    if (moveMessageIndex >= 0) {
      for (let i = children.length - 1; i >= moveMessageIndex; i--) children[i].remove();
    }
  }

  async function undoMove() {
    if (movePending) return;
    const button = document.getElementById('undo-move');
    button.disabled = true;
    let completed = false;
    try {
        const result = await api(puzzleMode ? '/api/puzzle/undo' : '/api/game/undo', {});
      removeLastMoveConversation();
      selectedAnnotationSquare = null;
      window.lastMessageAnnotations = [];
      document.getElementById('message-highlights').innerHTML = '';
      setLesson(null);
      renderState(result.state);
      addChat('assistant', 'Move undone. Try a different move.');
      completed = true;
    } catch (error) {
      addChat('assistant', error.message);
    } finally {
      if (!completed) button.disabled = false;
    }
  }

  async function resetPuzzle() {
    if (!puzzleMode || movePending) return;
    const button = document.getElementById('reset-puzzle');
    button.disabled = true;
    try {
      const result = await api('/api/puzzle/reset', {});
      selectedAnnotationSquare = null;
      window.lastMessageAnnotations = [];
      document.getElementById('message-highlights').innerHTML = '';
      setLesson(null);
      // A reset can return to a FEN previously rendered in this session.
      // Clear the cache so chessboard.js always redraws the starting position.
      lastFen = null;
      renderState(result.state);
      addChat('assistant', 'Puzzle reset. Find the strongest move.', result.state);
    } catch (error) {
      addChat('assistant', error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function endGame() {
    if (movePending) return;
    const button = document.getElementById('end-game');
    button.disabled = true;
    try {
      await api(puzzleMode ? '/api/puzzle/end' : '/api/game/end', {});
      window.location.reload();
    } catch (error) {
      addChat('assistant', error.message);
      button.disabled = false;
    }
  }

  async function copyText(text) {
    if (!text) throw new Error('Nothing to copy');
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const input = document.createElement('textarea');
    input.value = text;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    const copied = document.execCommand('copy');
    input.remove();
    if (!copied) throw new Error('Clipboard access was unavailable');
  }

  async function copyFEN() {
    const button = document.getElementById('copy-fen');
    if (!currentState || !currentState.fen) return;
    button.disabled = true;
    try {
      await copyText(currentState.fen);
      button.textContent = 'FEN copied';
    } catch (error) {
      addChat('assistant', 'Could not copy the FEN: ' + error.message);
    } finally {
      window.setTimeout(() => { button.textContent = 'Copy FEN'; button.disabled = false; }, 1400);
    }
  }

  async function copyPgn() {
    const button = document.getElementById('copy-pgn');
    if (!currentState || currentState.puzzle_mode) return;
    button.disabled = true;
    try {
      const exported = await api('/api/game/export');
      await copyText(exported.pgn);
      button.textContent = 'PGN copied';
    } catch (error) {
      addChat('assistant', 'Could not copy the PGN: ' + error.message);
    } finally {
      window.setTimeout(() => { button.textContent = 'Copy PGN'; button.disabled = Boolean(currentState && currentState.puzzle_mode); }, 1400);
    }
  }

  function applyLessonNotes(lesson) {
    if (!lesson || typeof lesson.notes !== 'string') return;
    const input = document.getElementById('notes-input');
    if (input && input.value !== lesson.notes) input.value = lesson.notes;
    const status = document.getElementById('notes-status');
    if (status) status.textContent = 'Updated by coach';
  }

  async function explainJargon(term) {
    if (!term || movePending) return;
    const request = `Explain the chess term "${term}" in plain language, with a short example from the current position if useful.`;
    const button = document.getElementById('chat-send');
    addChat('user', request);
    button.disabled = true;
    try {
      const result = await api('/api/chat', {message: request});
      addChat('assistant', result.reply, result.state, result.lesson && result.lesson.annotations, result.lesson && result.lesson.jargon, result.lesson && result.lesson.move_annotations);
      applyLessonNotes(result.lesson);
      setLesson(result.lesson);
      renderState(result.state);
      jargonExplanation = {term, text: result.reply};
      document.getElementById('notes-add-explanation').style.display = 'inline-block';
      document.getElementById('notes-status').textContent = `Ready to add “${term}”`;
    } catch (error) {
      addChat('assistant', error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function addJargonExplanationToNotes() {
    if (!jargonExplanation) return;
    const input = document.getElementById('notes-input');
    const entry = `${jargonExplanation.term}: ${jargonExplanation.text}`;
    if (!input.value.includes(entry)) input.value = input.value.trim() ? `${input.value.trim()}\n\n${entry}` : entry;
    if (await saveNotes()) {
      jargonExplanation = null;
      document.getElementById('notes-add-explanation').style.display = 'none';
    }
  }

  function renderState(state) {
    if (!state || !state.fen) return;
    currentState = state;
    puzzleMode = Boolean(state.puzzle_mode);
    if (!gameActive) initBoard(state.player_color || 'white');
    if (state.fen !== lastFen) {
      selectedTapSquare = null;
      board.position(state.fen, true);
      lastFen = state.fen;
    }
    const expectedOrientation = state.player_color === 'black' ? 'black' : 'white';
    if (board.orientation() !== expectedOrientation) board.orientation(expectedOrientation);
    updatePanels(state);
    drawLastMove(state);
    drawTapSelection();
    drawMessageMoveHighlights(window.lastMessageMoveAnnotations || [], hoveredMoveAnnotation);
    const undoButton = document.getElementById('undo-move');
    if (undoButton) undoButton.disabled = !state.move_list || state.move_list.length === 0 || movePending;
    const resetButton = document.getElementById('reset-puzzle');
    if (resetButton) resetButton.classList.toggle('visible', Boolean(state.puzzle_mode));
    const endButton = document.getElementById('end-game');
    if (endButton) endButton.textContent = state.puzzle_mode ? 'End puzzle' : 'End game';
    const copyPgnButton = document.getElementById('copy-pgn');
    if (copyPgnButton) copyPgnButton.disabled = Boolean(state.puzzle_mode);
    const betterMovesButton = document.getElementById('better-moves');
    if (betterMovesButton) betterMovesButton.disabled = Boolean(state.puzzle_mode);
  }

  function addChat(role, text, state, annotations, jargon, moveAnnotations) {
    const messages = document.getElementById('chat-messages');
    if (!messages || !text) return;
    const el = document.createElement('div');
    el.className = 'chat-message ' + role;
    if (role === 'assistant') {
      window.lastMessageAnnotations = annotations || [];
      window.lastMessageMoveAnnotations = moveAnnotations || [];
      selectedAnnotationSquare = null;
      hoveredMoveAnnotation = null;
      el.innerHTML = formatChatText(text, annotations || [], jargon || [], moveAnnotations || []);
    }
    else el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    if (role === 'assistant' && state) {
      drawMessageHighlights(state, annotations || []);
      drawMessageMoveHighlights(moveAnnotations || []);
    }
  }

  function formatChatText(text, annotations, jargon, moveAnnotations) {
    const marks = (annotations || [])
      .filter(annotation => annotation.text)
      .map(annotation => {
        const start = text.toLowerCase().indexOf(annotation.text.toLowerCase());
        return {...annotation, markType: 'board', start, end: start + annotation.text.length};
      })
      .concat((jargon || []).filter(annotation => annotation.text).map(annotation => {
        const start = text.toLowerCase().indexOf(annotation.text.toLowerCase());
        return {...annotation, markType: 'jargon', start, end: start + annotation.text.length};
      }))
      .concat((moveAnnotations || []).filter(annotation => annotation.text && annotation.uci).map(annotation => {
        const start = text.toLowerCase().indexOf(annotation.text.toLowerCase());
        return {...annotation, markType: 'move', start, end: start + annotation.text.length};
      }))
      .filter(annotation => annotation.start >= 0)
      .sort((a, b) => a.start - b.start || (a.markType === 'move' ? -1 : 1));
    let result = '';
    let cursor = 0;
    marks.forEach(annotation => {
      if (annotation.start < cursor) return;
      result += esc(text.slice(cursor, annotation.start));
      if (annotation.markType === 'jargon') {
        result += `<span class="chat-token-annotation chat-token-jargon" role="button" tabindex="0" data-jargon-term="${esc(annotation.term)}" title="Explain ${esc(annotation.term)}">${esc(text.slice(annotation.start, annotation.end))}</span>`;
        cursor = annotation.end;
        return;
      }
      if (annotation.markType === 'move') {
        const color = annotation.color === 'black' ? 'black' : 'white';
        const uci = annotation.uci.toLowerCase();
        result += `<span class="chat-token-move ${color}" role="button" tabindex="0" data-move-uci="${esc(uci)}" data-move-color="${color}" title="Show ${esc(text.slice(annotation.start, annotation.end))} on the board">${esc(text.slice(annotation.start, annotation.end))}</span>`;
        cursor = annotation.end;
        return;
      }
      const className = annotation.kind === 'piece'
        ? `chat-token-piece ${pieceClass(annotation.piece)}`
        : 'chat-token-square';
      result += `<span class="${className} chat-token-annotation" role="button" tabindex="0" data-annotation-square="${annotation.square}" title="Highlight ${annotation.square}">${esc(text.slice(annotation.start, annotation.end))}</span>`;
      cursor = annotation.end;
    });
    return result + esc(text.slice(cursor));
  }

  function pieceClass(piece) {
    return {k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn'}[piece] || '';
  }

  function drawLastMove(state) {
    const group = document.getElementById('last-move-drawing');
    if (!group) return;
    const uci = state.last_move || '';
    if (uci.length < 4) { group.innerHTML = ''; return; }
    const from = squarePoint(uci.slice(0, 2), board.orientation());
    const to = squarePoint(uci.slice(2, 4), board.orientation());
    group.innerHTML = `<line class="last-move-arrow" marker-end="url(#last-arrow-head)" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}"></line>`;
  }

  function boardSquareFromElement(element) {
    const square = element.closest('[class*="square-"]');
    if (!square || !document.getElementById('board').contains(square)) return null;
    const className = Array.from(square.classList).find(name => /^square-[a-h][1-8]$/.test(name));
    return className ? className.slice(-2) : null;
  }

  function pieceAtSquare(fen, targetSquare) {
    const placement = String(fen || '').split(' ')[0];
    const rows = placement.split('/');
    if (rows.length !== 8 || !/^[a-h][1-8]$/.test(targetSquare)) return null;
    const rank = 8 - Number(targetSquare[1]);
    let file = 0;
    for (const char of rows[rank]) {
      if (/\d/.test(char)) file += Number(char);
      else {
        if (file === targetSquare.charCodeAt(0) - 97) return char;
        file += 1;
      }
    }
    return null;
  }

  function isSideToMove(piece) {
    if (!piece || !currentState || !currentState.fen) return false;
    const turn = currentState.fen.split(' ')[1];
    return turn === 'w' ? piece === piece.toUpperCase() : piece === piece.toLowerCase();
  }

  function clearTapSelection() {
    selectedTapSquare = null;
    drawTapSelection();
  }

  function drawTapSelection() {
    const group = document.getElementById('tap-selection');
    if (!group || !board || !selectedTapSquare) {
      if (group) group.innerHTML = '';
      return;
    }
    const point = squarePoint(selectedTapSquare, board.orientation());
    group.innerHTML = `<rect class="tap-selected-square" x="${point.x - .5}" y="${point.y - .5}" width="1" height="1"></rect>` +
      `<circle class="tap-selected-piece" cx="${point.x}" cy="${point.y}" r=".36"></circle>`;
  }

  function handleBoardTap(event) {
    if (Date.now() < suppressBoardClickUntil || movePending) return;
    const square = boardSquareFromElement(event.target);
    handleBoardSquareTap(square);
  }

  function handleBoardSquareTap(square) {
    if (movePending) return;
    if (!square || !currentState || !currentState.fen) return;
    const piece = pieceAtSquare(currentState.fen, square);
    if (!selectedTapSquare) {
      if (isSideToMove(piece)) {
        selectedTapSquare = square;
        drawTapSelection();
      }
      return;
    }
    if (square === selectedTapSquare) {
      clearTapSelection();
      return;
    }
    if (isSideToMove(piece)) {
      selectedTapSquare = square;
      drawTapSelection();
      return;
    }
    const source = selectedTapSquare;
    clearTapSelection();
    handleDrop(source, square, true);
  }

  function matchingTouch(touches, identifier) {
    return Array.from(touches).find(touch => touch.identifier === identifier);
  }

  function beginTouchTap(event) {
    if (movePending || event.touches.length !== 1) return;
    const touch = event.touches[0];
    touchTapStart = {identifier: touch.identifier, x: touch.clientX, y: touch.clientY, moved: false};
    event.preventDefault();
    event.stopImmediatePropagation();
  }

  function trackTouchTap(event) {
    if (!touchTapStart) return;
    const touch = matchingTouch(event.touches, touchTapStart.identifier);
    if (touch && Math.hypot(touch.clientX - touchTapStart.x, touch.clientY - touchTapStart.y) > 12) {
      touchTapStart.moved = true;
    }
    event.preventDefault();
    event.stopImmediatePropagation();
  }

  function finishTouchTap(event) {
    if (!touchTapStart) return;
    const touch = matchingTouch(event.changedTouches, touchTapStart.identifier);
    const tap = touchTapStart;
    touchTapStart = null;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (touch && !tap.moved) {
      handleBoardSquareTap(boardSquareFromElement(document.elementFromPoint(touch.clientX, touch.clientY)));
    }
  }

  function cancelTouchTap(event) {
    touchTapStart = null;
    event.preventDefault();
    event.stopImmediatePropagation();
  }

  function drawMessageHighlights(state, annotations) {
    const group = document.getElementById('message-highlights');
    if (!group) return;
    const locationMarkup = (annotations || []).filter(annotation => annotation.kind === 'square').map(annotation => {
      const square = annotation.square;
      const point = squarePoint(square, board.orientation());
      return `<rect class="message-square" x="${point.x - .5}" y="${point.y - .5}" width="1" height="1"></rect>`;
    }).join('');
    const pieceMarkup = (annotations || []).filter(annotation => annotation.kind === 'piece').map(annotation => {
      const square = annotation.square;
      const point = squarePoint(square, board.orientation());
      return `<circle class="message-piece" cx="${point.x}" cy="${point.y}" r=".34"></circle>`;
    }).join('');
    let selectedMarkup = '';
    if (selectedAnnotationSquare) {
      const point = squarePoint(selectedAnnotationSquare, board.orientation());
      selectedMarkup = `<rect class="message-selected-square" x="${point.x - .5}" y="${point.y - .5}" width="1" height="1"></rect><circle class="message-selected-piece" cx="${point.x}" cy="${point.y}" r=".39"></circle>`;
    }
    group.innerHTML = locationMarkup + pieceMarkup + selectedMarkup;
  }

  function moveAnnotationFromElement(element) {
    return {uci: element.dataset.moveUci, color: element.dataset.moveColor};
  }

  function drawMessageMoveHighlights(moveAnnotations, emphasisedMove) {
    const group = document.getElementById('message-move-highlights');
    if (!group || !board) return;
    group.innerHTML = (moveAnnotations || []).map(annotation => {
      const uci = String(annotation.uci || '').toLowerCase();
      if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(uci)) return '';
      const color = annotation.color === 'black' ? 'black' : 'white';
      const emphasised = emphasisedMove && emphasisedMove.uci === uci && emphasisedMove.color === color;
      const emphasisClass = emphasised ? ' emphasised' : '';
      const from = squarePoint(uci.slice(0, 2), board.orientation());
      const to = squarePoint(uci.slice(2, 4), board.orientation());
      return `<rect class="message-move-square ${color}${emphasisClass}" x="${from.x - .5}" y="${from.y - .5}" width="1" height="1"></rect>` +
        `<rect class="message-move-square ${color}${emphasisClass}" x="${to.x - .5}" y="${to.y - .5}" width="1" height="1"></rect>` +
        `<line class="message-move-arrow ${color}${emphasisClass}" marker-end="url(#message-${color}-arrow-head)" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}"></line>`;
    }).join('');
  }

  function setLesson(lesson) {
    currentLesson = lesson && lesson.demo_moves && lesson.demo_moves.length ? lesson : null;
    lessonIndex = 0;
    document.getElementById('lesson-controls').classList.toggle('visible', !!currentLesson);
    if (currentLesson) {
      document.getElementById('lesson-title').textContent = currentLesson.demo_title || 'Suggested line';
      showLessonMove(0);
    } else {
      document.getElementById('overlay-drawing').innerHTML = '';
    }
  }

  function squarePoint(square, orientation) {
    const file = square.charCodeAt(0) - 97;
    const rank = Number(square[1]) - 1;
    return orientation === 'black' ? {x: 7 - file + .5, y: rank + .5} : {x: file + .5, y: 7 - rank + .5};
  }

  function showLessonMove(index) {
    if (!currentLesson) return;
    lessonIndex = Math.max(0, Math.min(index, currentLesson.demo_moves.length - 1));
    const move = currentLesson.demo_moves[lessonIndex];
    const from = squarePoint(move.from, board.orientation());
    const to = squarePoint(move.to, board.orientation());
    document.getElementById('overlay-drawing').innerHTML =
      `<rect class="overlay-square" x="${from.x - .5}" y="${from.y - .5}" width="1" height="1"></rect>` +
      `<rect class="overlay-square" x="${to.x - .5}" y="${to.y - .5}" width="1" height="1"></rect>` +
      `<line class="overlay-arrow" marker-end="url(#arrow-head)" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}"></line>` +
      `<text class="overlay-label" x="${to.x - .12}" y="${to.y + .12}">${esc(move.san)}</text>`;
    document.getElementById('lesson-count').textContent = `${lessonIndex + 1}/${currentLesson.demo_moves.length}`;
  }

  function playLesson() {
    if (!currentLesson) return;
    if (lessonTimer) {
      clearInterval(lessonTimer); lessonTimer = null;
      document.getElementById('lesson-play').textContent = 'Play';
      return;
    }
    document.getElementById('lesson-play').textContent = 'Pause';
    lessonTimer = setInterval(() => {
      if (lessonIndex >= currentLesson.demo_moves.length - 1) {
        clearInterval(lessonTimer); lessonTimer = null;
        document.getElementById('lesson-play').textContent = 'Play';
      } else showLessonMove(lessonIndex + 1);
    }, 1200);
  }

  function showPlayerMove(source, target) {
    // A tap-to-move does not go through Chessboard.js's drag renderer, so
    // animate it explicitly before waiting for the coach's reply.
    if (board) board.move(`${source}-${target}`);
  }

  function waitForPlayerMoveAnimation() {
    const remaining = deferBoardStateUntil - Date.now();
    return remaining > 0 ? new Promise(resolve => window.setTimeout(resolve, remaining)) : Promise.resolve();
  }

  function handleDrop(source, target, animatePlayerMove = false) {
    if (!/^[a-h][1-8]$/.test(source) || !/^[a-h][1-8]$/.test(target) || source === target) {
      return 'snapback';
    }
    if (movePending) return 'snapback';
    if (animatePlayerMove) showPlayerMove(source, target);
    // Do not let a poll or fast engine reply replace the board before the
    // player's move has had time to render.
    deferBoardStateUntil = Date.now() + 260;
    movePending = true;
    document.getElementById('board').classList.add('move-pending');
    api(puzzleMode ? '/api/puzzle/move' : '/api/game/move', {
      move: source + target,
      ...(puzzleMode ? {} : {
        show_hint: document.getElementById('show-next-hint').checked,
        explain_engine_move: document.getElementById('explain-engine-move').checked,
      }),
    }).then(async result => {
      await waitForPlayerMoveAnimation();
      renderState(result.state);
      if (puzzleMode) {
        addChat('assistant', result.reply, result.state);
      } else {
        addChat('assistant', result.reply, result.state, result.lesson && result.lesson.annotations, result.lesson && result.lesson.jargon, result.lesson && result.lesson.move_annotations);
        applyLessonNotes(result.lesson);
        setLesson(result.lesson);
      }
    }).catch(error => {
      if (lastFen) board.position(lastFen, true);
      addChat('assistant', error.message);
    }).finally(() => {
      movePending = false;
      document.getElementById('board').classList.remove('move-pending');
    });
    // Keep the locally dragged piece at the target while the request is pending.
    return undefined;
  }

  function setBoardDragScrolling(disabled) {
    document.documentElement.classList.toggle('board-dragging', disabled);
  }

  function startPieceDrag() {
    if (movePending) return false;
    setBoardDragScrolling(true);
    return true;
  }

  function finishPieceDrag(source, target) {
    setBoardDragScrolling(false);
    // Chessboard.js reports a simple tap as a no-op drop. Let the click event
    // below select the piece instead of sending an invalid UCI move.
    if (!/^[a-h][1-8]$/.test(source) || !/^[a-h][1-8]$/.test(target) || source === target) {
      return 'snapback';
    }
    suppressBoardClickUntil = Date.now() + 250;
    return handleDrop(source, target);
  }

  async function sendChat(event) {
    event.preventDefault();
    const input = document.getElementById('chat-input');
    const button = document.getElementById('chat-send');
    const message = input.value.trim();
    if (!message || movePending) return;
    input.value = '';
    addChat('user', message);
    button.disabled = true;
    try {
      const result = await api('/api/chat', {message});
      addChat('assistant', result.reply, result.state, result.lesson && result.lesson.annotations, result.lesson && result.lesson.jargon, result.lesson && result.lesson.move_annotations);
      applyLessonNotes(result.lesson);
      setLesson(result.lesson);
      renderState(result.state);
    } catch (error) { addChat('assistant', error.message); }
    finally { button.disabled = false; input.focus(); }
  }

  async function requestBetterMoves(ply, trigger) {
    if (movePending || puzzleMode) return;
    const button = trigger || document.getElementById('better-moves');
    if (!button) return;
    button.disabled = true;
    addChat('user', Number.isInteger(ply) ? 'Show better moves instead of that move.' : 'Show me the better moves here.');
    try {
      const result = await api('/api/game/better-moves', Number.isInteger(ply) ? {ply} : {});
      addChat('assistant', result.reply, result.state, result.lesson && result.lesson.annotations, result.lesson && result.lesson.jargon, result.lesson && result.lesson.move_annotations);
      applyLessonNotes(result.lesson);
      setLesson(result.lesson);
      renderState(result.state);
    } catch (error) {
      addChat('assistant', error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function startGame() {
    const button = document.getElementById('start-game');
    button.disabled = true;
    try {
      const result = await api('/api/game/new', {
        player_color: document.getElementById('setup-color').value,
        target_elo: Number(document.getElementById('setup-elo').value) || 800,
      });
      renderState(result.state);
      addChat('assistant', 'I\'m ready. Make your first move, or ask me anything about the position.');
      if (result.state.player_color === 'black') {
      const move = await api('/api/game/engine-move', {}).catch(() => null);
        if (move) renderState(move.state);
      }
    } catch (error) { addChat('assistant', error.message); button.disabled = false; }
  }

  async function startPuzzle() {
    const button = document.getElementById('start-puzzle');
    button.disabled = true;
    try {
      const result = await api('/api/puzzle/new', {
        difficulty: document.getElementById('puzzle-difficulty').value,
        motif: document.getElementById('puzzle-motif').value,
      });
      renderState(result.state);
      const puzzle = result.state.puzzle || {};
      addChat('assistant', `Puzzle: ${puzzle.motif || 'tactics'} (${puzzle.difficulty || 'mixed'}). Find the strongest move. Ask me for an explanation after you try.`, result.state);
    } catch (error) {
      addChat('assistant', error.message);
      button.disabled = false;
    }
  }

  function capturedToUnicode(pieces, color) {
    if (!pieces || !pieces.length) return '';
    return pieces.map(p => {
      const key = color === 'white' ? p.toLowerCase() : p.toUpperCase();
      // White captures black pieces (lowercase), black captures white pieces (uppercase)
      // "captured by white" means those are black pieces
      const displayKey = color === 'white' ? p.toLowerCase() : p;
      return PIECE_UNICODE[displayKey] || p;
    }).join(' ');
  }

  function updatePanels(state) {
    // Header
    const sessionInfo = document.getElementById('session-info');
    if (sessionInfo) sessionInfo.textContent = 'Session #' + (state.session_number || 1);
    const streak = state.streak || 0;
    const streakInfo = document.getElementById('streak-info');
    if (streakInfo) streakInfo.textContent = 'Streak: ' + streak + (streak >= 3 ? ' \uD83D\uDD25' : '');

    // Board info
    document.getElementById('player-info').textContent = 'Playing as: ' + capitalize(state.player_color || 'white');
    document.getElementById('engine-info').textContent = state.puzzle_mode
      ? 'Puzzle: ' + ((state.puzzle && state.puzzle.motif) || 'tactics')
      : 'Engine: ' + (state.target_elo || 800) + ' Elo';
    if (Object.prototype.hasOwnProperty.call(state, 'black_capture')) {
      const captureAlert = document.getElementById('capture-alert');
      const capture = state.black_capture;
      if (capture && capture.square) {
        const pieceNames = {p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king'};
        const captured = pieceNames[capture.captured_piece] || 'piece';
        captureAlert.textContent = `Black captured a ${captured} on ${capture.square}${capture.move ? ` with ${capture.move}` : ''}`;
        captureAlert.classList.add('visible');
      } else {
        captureAlert.textContent = '';
        captureAlert.classList.remove('visible');
      }
    }

    // Opening
    const openingEl = document.getElementById('opening-display');
    const op = state.current_opening;
    if (op && op.name) {
      openingEl.innerHTML = '<span class="opening-name">' + esc(op.name) + '</span>' +
        (op.eco ? '<span class="opening-eco">' + esc(op.eco) + '</span>' : '');
    } else {
      const moveCount = (state.move_list || []).length;
      openingEl.innerHTML = '<span class="out-of-book">' + (moveCount > 0 ? 'Out of book' : 'Starting position') + '</span>';
    }

    // Material
    const mat = state.material || { white: 0, black: 0 };
    document.getElementById('mat-white').textContent = mat.white;
    document.getElementById('mat-black').textContent = mat.black;
    const diff = mat.white - mat.black;
    const diffEl = document.getElementById('mat-diff');
    if (diff > 0) {
      diffEl.textContent = '+' + diff + ' White';
      diffEl.className = 'material-diff positive';
    } else if (diff < 0) {
      diffEl.textContent = diff + ' Black';
      diffEl.className = 'material-diff negative';
    } else {
      diffEl.textContent = 'Even';
      diffEl.className = 'material-diff even';
    }

    // Captured pieces
    const cap = state.captured_pieces || { white: [], black: [] };
    document.getElementById('captured-white').innerHTML =
      cap.white.length ? '\u25B3 ' + capturedToUnicode(cap.white, 'white') : '';
    document.getElementById('captured-black').innerHTML =
      cap.black.length ? '\u25BD ' + capturedToUnicode(cap.black, 'black') : '';

    // Eval bar
    const evalScore = state.eval_score;
    const evalEl = document.getElementById('eval-score');
    const barEl = document.getElementById('eval-bar');
    if (evalScore != null) {
      const clamped = Math.max(-10, Math.min(10, evalScore));
      const pct = Math.round(((clamped + 10) / 20) * 100);
      barEl.style.width = pct + '%';
      evalEl.textContent = (evalScore > 0 ? '+' : '') + evalScore.toFixed(1);
    } else {
      barEl.style.width = '50%';
      evalEl.textContent = '--';
    }

    // Game status
    const fen = state.fen || '';
    const parts = fen.split(' ');
    const turnColor = parts[1] === 'b' ? 'Black' : 'White';
    const fullmove = parts[5] || '1';
    document.getElementById('move-number').textContent = fullmove;
    document.getElementById('turn-display').textContent = turnColor + ' to play';

    const acc = state.accuracy || { white: 0, black: 0 };
    document.getElementById('acc-white').textContent =
      acc.white ? acc.white.toFixed(1) + '%' : '--';
    document.getElementById('acc-black').textContent =
      acc.black ? acc.black.toFixed(1) + '%' : '--';

    const statusEl = document.getElementById('check-status');
    if (state.is_checkmate) {
      statusEl.innerHTML = '<span class="checkmate-indicator">Checkmate!</span>';
    } else if (state.is_stalemate) {
      statusEl.innerHTML = '<span class="check-indicator">Stalemate</span>';
    } else if (state.is_check) {
      statusEl.innerHTML = '<span class="check-indicator">Check!</span>';
    } else {
      statusEl.textContent = 'In progress';
    }

    // Move history with annotations
    const moveList = state.move_list || [];
    const annotations = state.move_annotations || [];
    const annotMap = {};
    annotations.forEach(a => { annotMap[a.ply] = a; });

    const historyEl = document.getElementById('move-history');
    let html = '';
    for (let i = 0; i < moveList.length; i += 2) {
      const moveNum = Math.floor(i / 2) + 1;
      const whiteMove = moveList[i];
      const blackMove = i + 1 < moveList.length ? moveList[i + 1] : '';

      html += '<div class="move-row">';
      html += '<span class="move-num">' + moveNum + '.</span>';
      html += renderMoveCell(whiteMove, annotMap[i]);
      if (blackMove) {
        html += renderMoveCell(blackMove, annotMap[i + 1]);
      }
      html += '</div>';
    }
    historyEl.innerHTML = html;
    historyEl.scrollTop = historyEl.scrollHeight;

    // Game over banner
    const banner = document.getElementById('game-over');
    if (state.is_game_over && state.result) {
      banner.classList.add('visible');
      let resultText = state.result;
      if (state.result === '1-0') resultText = '1-0 \u2014 White wins';
      else if (state.result === '0-1') resultText = '0-1 \u2014 Black wins';
      else if (state.result === '1/2-1/2') resultText = '\u00BD-\u00BD \u2014 Draw';
      document.getElementById('game-over-result').textContent = resultText;
      const totalMoves = Math.ceil(moveList.length / 2);
      const playerColor = state.player_color || 'white';
      const playerAcc = acc[playerColor] || 0;
      document.getElementById('game-over-details').textContent =
        'Accuracy: ' + playerAcc.toFixed(1) + '% \u00B7 ' + totalMoves + ' moves';
    } else {
      banner.classList.remove('visible');
    }
  }

  function renderMoveCell(san, annot) {
    let badgeHtml = '';
    if (annot && annot.classification) {
      const b = BADGE_MAP[annot.classification];
      if (b) {
        badgeHtml = '<span class="badge ' + b.cls + '">' + b.text + '</span>';
      }
    }
    const reviewButton = annot && Number.isInteger(annot.ply)
      ? '<button type="button" class="move-review" data-review-ply="' + annot.ply + '" title="Explain better moves from before ' + esc(san) + '">Review</button>'
      : '';
    return '<span class="move-cell"><span class="move-san">' + esc(san) + '</span>' + badgeHtml + reviewButton + '</span>';
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Polling loop
  async function poll() {
    try {
      const resp = await fetch('/api/game');
      if (!resp.ok) return;
      const state = await resp.json();
      if (state && state.fen && Date.now() >= deferBoardStateUntil) renderState(state);
    } catch (e) {
      // Server might be down, just retry
    }
  }

  setInterval(poll, 500);
  document.getElementById('start-game').addEventListener('click', startGame);
  document.getElementById('start-puzzle').addEventListener('click', startPuzzle);
  poll();
})();
</script>
</body>
</html>
